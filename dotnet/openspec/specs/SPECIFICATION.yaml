# CompanyName Framework - Technical Specification
# OpenSpec Format

metadata:
  title: "CompanyName Enterprise Modular Framework"
  subtitle: "Domain-Driven Design | CQRS | Clean Architecture"
  version: "1.0.0-rc"
  status: "Draft"
  lastUpdated: "2026-05-13"
  
project:
  name: "CompanyName Framework"
  company: "Verisure"
  author: "Capgemini Engineering"
  targetFramework: ".NET 8.0"
  language: "C#"
  
architecture:
  patterns:
    - "Domain-Driven Design (DDD)"
    - "CQRS (Command Query Responsibility Segregation)"
    - "Clean Architecture"
    - "Specification Pattern"
    - "Unit of Work Pattern"
    - "Event Sourcing"
  
  layers:
    - "Presentation (ASP.NET Core)"
    - "Application (DDD Application Services)"
    - "Domain (Business Logic & Rules)"
    - "Data Access (Repository + EF Core/Dapper)"
    - "Infrastructure (Cross-cutting Concerns)"
    - "Core (Utilities & Base Classes)"

modules:
  crossCutting:
    - "Caching (Hybrid + Redis)"
    - "EventBus (Local + Azure)"
    - "ServiceBus (Local + Azure)"
    - "Repository Pattern (EF Core + Dapper with Specification)"
    - "Domain & Application Base Services"
    - "Auditing"
    - "Security/Claims"
    - "Localization"
    - "Logging/Application Insights"
    - "Validation (FluentValidation)"

templates:
  packageBase: "CompanyName.Templates"
  concrete:
    - name: "aspnetcore-module"
      shortName: "CompanyNameLower-module"
